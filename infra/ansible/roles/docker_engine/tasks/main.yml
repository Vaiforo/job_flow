---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create apt key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Install official Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Detect Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_engine_architecture
  changed_when: false
- name: Configure official Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_engine_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
    filename: docker
    state: present
- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
- name: Read administrator groups
  ansible.builtin.command: id -nG admin
  register: docker_engine_admin_groups
  changed_when: false
- name: Ensure administrator has no direct Docker socket access
  ansible.builtin.assert:
    that: "'docker' not in docker_engine_admin_groups.stdout.split()"
