---
- name: Create application directory
  ansible.builtin.file:
    path: /srv/quotes-scraper
    state: directory
    mode: '0755'
- name: Create writable worker directories
  ansible.builtin.file:
    path: "/srv/quotes-scraper/{{ item }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
  loop: [results, control]
- name: Copy application build inputs
  ansible.builtin.copy:
    src: "{{ project_root }}/{{ item }}"
    dest: /srv/quotes-scraper/
    mode: '0644'
    directory_mode: '0755'
  loop: [Dockerfile, .dockerignore, package.json, package-lock.json, src]
  notify: Build and deploy application
- name: Copy Compose configuration
  ansible.builtin.copy:
    src: "{{ project_root }}/deploy/compose.yaml"
    dest: /srv/quotes-scraper/compose.yaml
    mode: '0644'
  notify: Deploy application
- name: Copy Redis configuration
  ansible.builtin.copy:
    src: "{{ project_root }}/deploy/redis.conf"
    dest: /srv/quotes-scraper/redis.conf
    mode: '0644'
  notify: Restart Redis
- name: Copy Nginx configuration
  ansible.builtin.copy:
    src: "{{ project_root }}/deploy/nginx.conf"
    dest: /srv/quotes-scraper/nginx.conf
    mode: '0644'
  notify: Restart Nginx
- name: Apply configuration handlers
  ansible.builtin.meta: flush_handlers
- name: Ensure application is running
  community.docker.docker_compose_v2:
    project_src: /srv/quotes-scraper
    state: present
    wait: true
    wait_timeout: 90
