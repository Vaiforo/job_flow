name: CI

on:
  push:
    branches: [main, feat/quotes-scrapper, feat/terraform-infra]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Terraform formatting, validate, and plan
        run: make ci
